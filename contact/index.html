<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeeU2 - Contact</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .page-wrapper {
      flex: 1;
      min-height: calc(100vh - 50px - 76px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #contact {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem 1rem;
      min-height: auto;
    }

    #contact img {
      width: auto;
      height: auto;
      max-height: min(48vh, 520px);
      object-fit: contain;
      margin-bottom: 10px;
    }

    #contact p {
      margin: 0;
      font-size: 1em;
      line-height: 1.2;
    }

    .contact-icon img {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }

    .poem-container {
      max-width: 700px;
      margin: 1rem auto;
      padding: 0.5rem 1rem;
      font-size: 0.9em;
      line-height: 2.1;
      white-space: pre-line;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .contact-gallery {
      width: 80%;
      max-width: 600px;
      margin: 1rem auto;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .contact-gallery img {
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 0;
      border-radius: 0;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .contact-gallery img:hover {
      transform: scale(1.02);
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .page-wrapper {
        min-height: auto;
      }

      #contact {
        padding-top: 2rem;
        padding-bottom: 2rem;
      }

      .contact-gallery {
        width: 90%;
      }

      #contact img {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <!-- 引用 navbar.html -->
  <div id="navbar"></div>
  <script src="/assets/js/loadNavbar.js"></script>
  <script src="/assets/js/navunderline.js"></script>
  <!-- 引用 navbar.html -->

  <div class="page-wrapper">
    <!-- Contact Section -->
    <section id="contact">
      <div class="poem-container">


        
        2000 *天秤 *INTP-A *女生 *杭州 
        妆发 & 摄影 & 数据挖掘工程师。
        喜欢音乐、电影、摄影、徒步、运动、滑板、手工...
        Feel free to reach out to me via email or social media.
        希望能结识兴趣相投的朋友。
      </div>
      <div class="contact-gallery">
        <img
          src="https://img.leeu2.com/optimized/small/contact/contact_about1.webp"
          srcset="https://img.leeu2.com/optimized/small/contact/contact_about1.webp 1280w, https://img.leeu2.com/optimized/large/contact/contact_about1.webp 2560w"
          sizes="(max-width: 640px) 96vw, 1200px"
          data-large-src="https://img.leeu2.com/optimized/large/contact/contact_about1.webp"
          alt="Contact Image"
          loading="lazy"
          decoding="async"
          class="fullscreenImage"
        />
      </div>
      <div class="poem-container"> 
      </div>
    </section>
  </div>
  <div id="site-footer"></div>
  <script src="/assets/js/loadFooter.js"></script>
  <script src="/assets/js/menu.js"></script>
</body>
</html>
